# Publish a client package to PyPI or npm from a release tag, with no long-lived registry secrets:
# PyPI through Trusted Publishing (OIDC, with attestations) and npm through Trusted Publishing with provenance.
#
# Tag format: <package>-v<version>, one tag per package, for example
#   sdk-python-v0.1.1, recorder-python-v0.1.1, integrations-python-v0.1.1,
#   sdk-js-v0.1.1, recorder-js-v0.1.1, integrations-js-v0.1.1
# The tag's version must equal the version in the package's pyproject.toml / package.json, or the job fails.
#
# One-time setup, per package: on pypi.org, the project's Publishing settings name this repository
# (commitlayer/commitlayer), this workflow file (publish.yml) and the environment "release"; on npmjs.com, the
# package's Trusted Publisher names the same three and has "Allow npm publish" ticked. The GitHub environment
# "release" exists in this repository. After that, pushing a tag publishes.
name: publish
on:
  push:
    tags:
      - "sdk-python-v*"
      - "recorder-python-v*"
      - "integrations-python-v*"
      - "sdk-js-v*"
      - "recorder-js-v*"
      - "integrations-js-v*"

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      package: ${{ steps.parse.outputs.package }}
      version: ${{ steps.parse.outputs.version }}
      dir: ${{ steps.parse.outputs.dir }}
      ecosystem: ${{ steps.parse.outputs.ecosystem }}
    steps:
      - id: parse
        run: |
          tag="${GITHUB_REF_NAME}"
          package="${tag%-v*}"
          version="${tag##*-v}"
          case "$package" in
            sdk-python) dir=sdk/python; eco=pypi ;;
            recorder-python) dir=recorder/python; eco=pypi ;;
            integrations-python) dir=integrations/python; eco=pypi ;;
            sdk-js) dir=sdk/js; eco=npm ;;
            recorder-js) dir=recorder/js; eco=npm ;;
            integrations-js) dir=integrations/js; eco=npm ;;
            *) echo "unknown package in tag $tag"; exit 1 ;;
          esac
          echo "package=$package" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "dir=$dir" >> "$GITHUB_OUTPUT"
          echo "ecosystem=$eco" >> "$GITHUB_OUTPUT"

  pypi:
    needs: resolve
    if: needs.resolve.outputs.ecosystem == 'pypi'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write # Trusted Publishing
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Version in pyproject.toml must match the tag
        working-directory: ${{ needs.resolve.outputs.dir }}
        run: |
          v=$(python -c 'import tomllib;print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')
          test "$v" = "${{ needs.resolve.outputs.version }}" || { echo "pyproject version $v != tag ${{ needs.resolve.outputs.version }}"; exit 1; }
      - name: Tests
        run: |
          python -m pip install -q pytest ./sdk/python ./recorder/python './integrations/python[temporal,inngest]'
          python -m pytest -q integrations/python/tests recorder/python/tests
      - name: Build
        working-directory: ${{ needs.resolve.outputs.dir }}
        run: python -m pip install -q build twine && python -m build && python -m twine check dist/*
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: ${{ needs.resolve.outputs.dir }}/dist

  npm:
    needs: resolve
    if: needs.resolve.outputs.ecosystem == 'npm'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write # Trusted Publishing with provenance
      contents: read
    steps:
      - uses: actions/checkout@v4
      # No registry-url: setup-node would write an empty _authToken into .npmrc and npm would skip the OIDC
      # exchange. Trusted publishing needs only id-token: write and npm 11.5.1 or newer.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g npm@latest
      - name: Version in package.json must match the tag
        working-directory: ${{ needs.resolve.outputs.dir }}
        run: |
          v=$(node -p "require('./package.json').version")
          test "$v" = "${{ needs.resolve.outputs.version }}" || { echo "package.json version $v != tag ${{ needs.resolve.outputs.version }}"; exit 1; }
      - name: Build and test
        working-directory: ${{ needs.resolve.outputs.dir }}
        run: npm ci && npm run build && npm test
      - name: Publish
        working-directory: ${{ needs.resolve.outputs.dir }}
        run: npm publish --provenance --access public
