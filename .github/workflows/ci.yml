name: ci
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python }}" }
      - name: Tests without any framework or runtime installed
        run: |
          python -m pip install -q pytest ./sdk/python ./recorder/python ./integrations/python
          python -m pytest -q integrations/python/tests recorder/python/tests
      - name: Tests with the two workflow runtimes
        run: |
          python -m pip install -q './integrations/python[temporal,inngest]'
          python -m pytest -q integrations/python/tests
      - name: Packages build and their metadata renders
        run: |
          python -m pip install -q build twine
          for d in sdk/python recorder/python integrations/python; do (cd $d && python -m build -q && python -m twine check dist/*); done

  node:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "${{ matrix.node }}" }
      - run: for d in sdk/js recorder/js integrations/js; do (cd $d && npm ci && npm run build && npm test); done
