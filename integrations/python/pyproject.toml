[project]
name = "commitlayer-integrations"
version = "0.1.1"
description = "CommitLayer integrations for agent frameworks and workflow runtimes: LangGraph, CrewAI, OpenAI Agents SDK, Pydantic AI, Temporal and Inngest"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Asterfold Labs, Inc.", email = "hello@commitlayer.ai" }]
keywords = ["ai-agents", "verification", "audit", "mcp", "observability"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries",
]
dependencies = ["commitlayer>=0.1.0"]

[project.optional-dependencies]
temporal = ["temporalio>=1.5"]
inngest = ["inngest>=0.4"]
langgraph = ["langgraph>=1.0", "langchain-core>=1.0"]
crewai = ["crewai>=1.0"]
openai-agents = ["openai-agents>=0.4"]
pydantic-ai = ["pydantic-ai-slim>=1.0"]
dev = ["pytest>=8", "ruff>=0.6", "temporalio>=1.5", "inngest>=0.4"]

[project.urls]
Homepage = "https://commitlayer.ai"
Documentation = "https://commitlayer.ai/docs"
Changelog = "https://commitlayer.ai/changelog"
Source = "https://github.com/commitlayer/commitlayer/tree/main/integrations/python"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["commitlayer_integrations*", "commitlayer_temporal*", "commitlayer_inngest*", "commitlayer_langgraph*", "commitlayer_crewai*", "commitlayer_openai_agents*", "commitlayer_pydantic_ai*"]
